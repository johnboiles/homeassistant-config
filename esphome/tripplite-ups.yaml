esphome:
  name: tripplite-ups
  friendly_name: Tripp Lite UPS

esp32:
  variant: esp32p4
  engineering_sample: true
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # Keep 360 MHz available for work; idle at 90 MHz with Ethernet active.
      # Automatic light sleep stays disabled so USB monitoring remains awake.
      CONFIG_PM_ENABLE: "y"
      CONFIG_PM_DFS_INIT_AUTO: "y"

# Function EV Board v1.4: GPIO54 -> C6_EN. Ethernet does not need the C6.
# GPIO outputs initialize low, holding the unused radio module in reset.
output:
  - platform: gpio
    id: c6_enable
    pin: GPIO54

# ESP32-P4 Function EV Board v1.4 onboard IP101 Ethernet PHY.
ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  phy_addr: 1
  power_pin: GPIO51
  clk:
    pin: GPIO50
    mode: CLK_EXT_IN

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  hardware_uart: UART0
  level: DEBUG

# Keep the USB host running even when HA is offline during bench testing.
api:
  encryption:
    key: !secret esphome_encryption_key
  reboot_timeout: 0s

external_components:
  - source:
      type: local
      path: components
    components: [usb_hid_ups]

usb_hid_ups:
  id: ups

sensor:
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
  - platform: template
    name: Battery Charge
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    update_interval: 5s
    lambda: |-
      auto d = id(ups).get_data();
      return d.connected ? d.battery_capacity : NAN;
  - platform: template
    name: Battery Runtime
    unit_of_measurement: s
    device_class: duration
    state_class: measurement
    update_interval: 5s
    lambda: |-
      auto d = id(ups).get_data();
      return d.connected ? d.remaining_runtime_sec : NAN;
  - platform: template
    name: Load
    unit_of_measurement: "%"
    state_class: measurement
    update_interval: 5s
    lambda: |-
      auto d = id(ups).get_data();
      return d.connected ? d.load_percent : NAN;
  - platform: template
    name: Input Voltage
    entity_category: diagnostic
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    update_interval: 5s
    lambda: |-
      auto d = id(ups).get_data();
      return d.connected ? d.utility_voltage : NAN;
  - platform: template
    name: Battery Voltage
    entity_category: diagnostic
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    update_interval: 5s
    lambda: |-
      auto d = id(ups).get_data();
      return d.connected ? d.battery_voltage : NAN;
  - platform: template
    name: Output Voltage
    entity_category: diagnostic
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      return id(ups).get_data().output_voltage;
  - platform: template
    name: Input Frequency
    entity_category: diagnostic
    unit_of_measurement: Hz
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      return id(ups).get_data().input_frequency;
  - platform: template
    name: Output Power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return id(ups).get_data().output_power;

binary_sensor:
  - platform: status
    name: Status
    entity_category: diagnostic
  - platform: template
    name: USB Connected
    entity_category: diagnostic
    device_class: connectivity
    lambda: return id(ups).get_data().connected;
  - platform: template
    name: Mains Present
    entity_category: diagnostic
    id: ups_ac_present
    device_class: power
    icon: mdi:power-plug
  - platform: template
    name: On Battery
    entity_category: diagnostic
    id: ups_on_battery
    icon: mdi:battery-arrow-down
  - platform: template
    name: Battery Charging
    entity_category: diagnostic
    id: ups_charging
    device_class: battery_charging
  - platform: template
    name: Battery Fully Charged
    entity_category: diagnostic
    id: ups_fully_charged
    icon: mdi:battery-check
  - platform: template
    name: Battery Fully Discharged
    entity_category: diagnostic
    id: ups_fully_discharged
    device_class: problem
    icon: mdi:battery-outline
  - platform: template
    name: Battery Low
    id: ups_battery_low_flag
    device_class: battery
  - platform: template
    name: Replace Battery
    entity_category: diagnostic
    id: ups_replace_battery
    device_class: problem
    icon: mdi:battery-alert
  - platform: template
    name: Shutdown Imminent
    id: ups_shutdown_imminent
    device_class: problem
    icon: mdi:power
  - platform: template
    name: AVR Boost Active
    entity_category: diagnostic
    id: ups_avr_boost
    icon: mdi:arrow-up-bold
  - platform: template
    name: AVR Buck Active
    entity_category: diagnostic
    id: ups_avr_buck
    icon: mdi:arrow-down-bold
  - platform: template
    name: Input Voltage Out of Range
    entity_category: diagnostic
    id: ups_voltage_out_of_range
    device_class: problem
    icon: mdi:sine-wave
  - platform: template
    name: Overload
    entity_category: diagnostic
    id: ups_overload
    device_class: problem
    icon: mdi:flash-alert
  - platform: template
    name: Over Temperature
    entity_category: diagnostic
    id: ups_over_temperature
    device_class: problem
    icon: mdi:thermometer-alert
  - platform: template
    name: Internal Fault
    entity_category: diagnostic
    id: ups_internal_failure
    device_class: problem
    icon: mdi:alert-circle
  - platform: template
    name: Awaiting Power
    entity_category: diagnostic
    id: ups_awaiting_power
    icon: mdi:power-plug-off

text_sensor:
  - platform: template
    name: Power Source
    update_interval: 5s
    lambda: |-
      auto d = id(ups).get_data();
      if (!d.connected || !d.ac_present_valid) return std::string("Unavailable");
      return std::string(d.ac_present ? "Mains" : "Battery");
  - platform: template
    name: UPS Model
    entity_category: diagnostic
    update_interval: 10s
    lambda: return std::string(id(ups).get_data().model);
  - platform: template
    name: Self Test Result
    id: ups_self_test_result
    entity_category: diagnostic
    icon: mdi:clipboard-check
    update_interval: 5s
    lambda: |-
      auto d = id(ups).get_data();
      return esphome::usb_hid_ups::self_test_result_text(d.self_test_result);
  - platform: template
    name: Beeper Status
    id: ups_beeper_status
    entity_category: diagnostic
    icon: mdi:volume-high
    update_interval: 5s
    lambda: |-
      auto d = id(ups).get_data();
      return esphome::usb_hid_ups::beeper_status_text(d.beeper_status);

# Publish all status flags from one snapshot. Returning {} from a binary
# template lambda would keep its old value; explicitly invalidate failed reads.
interval:
  - interval: 1s
    then:
      - lambda: |-
          const auto d = id(ups).get_data();
          auto publish = [](esphome::binary_sensor::BinarySensor *sensor, bool value, bool valid) {
            if (valid) sensor->publish_state(value);
            else sensor->invalidate_state();
          };
          publish(id(ups_ac_present), d.ac_present, d.ac_present_valid);
          publish(id(ups_on_battery), d.on_battery, d.on_battery_valid);
          publish(id(ups_charging), d.charging, d.charging_valid);
          publish(id(ups_fully_charged), d.fully_charged, d.fully_charged_valid);
          publish(id(ups_fully_discharged), d.fully_discharged, d.fully_discharged_valid);
          publish(id(ups_battery_low_flag), d.battery_low_flag, d.battery_low_flag_valid);
          publish(id(ups_replace_battery), d.replace_battery, d.replace_battery_valid);
          publish(id(ups_shutdown_imminent), d.shutdown_imminent, d.shutdown_imminent_valid);
          publish(id(ups_avr_boost), d.avr_boost, d.avr_boost_valid);
          publish(id(ups_avr_buck), d.avr_buck, d.avr_buck_valid);
          publish(id(ups_voltage_out_of_range), d.voltage_out_of_range, d.voltage_out_of_range_valid);
          publish(id(ups_overload), d.overload, d.overload_valid);
          publish(id(ups_over_temperature), d.over_temperature, d.over_temperature_valid);
          publish(id(ups_internal_failure), d.internal_failure, d.internal_failure_valid);
          publish(id(ups_awaiting_power), d.awaiting_power, d.awaiting_power_valid);
