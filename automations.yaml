  - condition: time
    after: '21:00:00'
    before: 06:00:00
  action:
  - service: script.set_homeseer_dim_level
    data_template:
      entity_id: '{{ trigger.entity_id }}'
      brightness: "{%- if trigger.entity_id == \"light.kitchen_island_light\" -%}\n
        \ 50\n{%- else -%}\n  3\n{%- endif -%}"
