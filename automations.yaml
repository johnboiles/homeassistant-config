  condition: []
  action:
  - repeat:
      count: '20'
      sequence:
      - service: media_player.volume_down
        target:
          entity_id: media_player.soundbar
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 500
  - repeat:
