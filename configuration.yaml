## Section: Core config
homeassistant:
  # Name of the location where Home Assistant is running
  name: Boiles Home
  # Location required to calculate the time the sun rises and sets
  latitude: !secret home_latitude
  longitude: !secret home_longitude
  # Impacts weather/sunrise data (altitude above sea level in meters)
  elevation: !secret home_elevation
  unit_system: us_customary
  # Pick yours from here: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  time_zone: America/Los_Angeles
  customize: !include customize.yaml
  country: US
  packages: !include_dir_named packages

recorder:
  db_url: !secret mysql_db_url

logger:
  default: warning

http:

## Section: Default config

# See https://www.home-assistant.io/integrations/default_config/
# `default_config` is a meta-component and configures a default set of
# integrations for Home Assistant to load. The integrations that will be
# loaded are: automation, cloud, config, frontend, history, logbook, map,
# mobile_app, person, script, ssdp, sun, system_health, zeroconf

# default_config:
energy:

automation: !include automations.yaml

# Nabu Casa cloud settings
cloud:

# Enables configuration UI
config:

# Enables the frontend
frontend:

# Enables support for tracking state changes over time.
history:

input_text:

input_boolean:
  house_occupied:
    name: House Occupied
    icon: mdi:home-account

# View all events in a logbook
logbook:

mobile_app:

person:

script: !include_dir_merge_named scripts

# Simple Service Discovery Protocol
ssdp:

# Track the sun
sun:

system_health:

zeroconf:

media_source:

## Section: Integration Config

ios:

# Allows you to issue voice commands from the frontend in enabled browsers
conversation:

homekit:
  entity_config:
    # switch.maple_sprinkler:
    #   type: sprinkler
    # switch.apple_and_lemon_sprinkler:
    #   type: sprinkler
    # switch.vegetable_box_sprinkler:
    #   type: sprinkler
    # switch.orange_tree_sprinkler:
    #   type: sprinkler
    # switch.lime_tree_sprinkler:
    #   type: sprinkler
    # switch.curb_sprinkler:
    #   type: sprinkler
    binary_sensor.front_door:
      linked_battery_sensor: sensor.front_door_battery_level
    binary_sensor.back_door:
      linked_battery_sensor: sensor.back_door_battery_level
    # camera.octoprint_camera:
    #   stream_source: http://10.0.2.17/webcam/?action=stream
  filter:
    include_entities:
      - binary_sensor.front_door
      - binary_sensor.back_door
      - binary_sensor.basement_side_door
      - binary_sensor.basement_motion_detected
    exclude_domains:
        # Accessory mode entities as per https://www.home-assistant.io/integrations/homekit/#accessory-mode
      - media_player
      - remote
      - lock
      - camera
      - cover
        # Others
      - group
      - automation
      - script
      - device_tracker
      - binary_sensor
      - person
      - alarm_control_panel
      - input_boolean
      - input_text
    exclude_entity_globs:
      - switch.schedule_*
      - '*.octoprint_*'
      - switch.heat_pump_*
      - '*basement_stereo_*'
      - sensor.pg_e_*
      - switch.*_sprinkler
    exclude_entities:
      - switch.3d_printer
      - switch.shutoff_valve
      - button.elijah_fan_turn_off
      - button.izzy_fan_turn_off
      - switch.john_s_eight_sleep_side_next_alarm
      - switch.christina_s_eight_sleep_side_next_alarm
      - switch.shelly_em1_shelly_em_switch
      - switch.heat_pump_power

route53:
  aws_access_key_id: !secret route53_access_key_id
  aws_secret_access_key: !secret route53_secret_access_key
  zone: !secret route53_zone
  domain: !secret route53_domain
  records:
    - house

## Section: Component configuration 

group: !include group.yaml

python_script:

sensor: !include sensor.yaml

template:
  - sensor:
    - default_entity_id: sensor.basement_smoke_alarm_state
      icon: hass:smoke-detector
      name: Basement Smoke Alarm
      state: >-
        {%- if is_state("sensor.basement_smoke_alarm_alarm_level", "0") -%}Clear
        {%- elif is_state("sensor.basement_smoke_alarm_alarm_type", "1") -%}Fire
        {%- elif is_state("sensor.basement_smoke_alarm_alarm_type", "2") -%}CO
        {%- elif is_state("sensor.basement_smoke_alarm_alarm_type", "12") -%}Testing
        {%- elif is_state("sensor.basement_smoke_alarm_alarm_type", "13") -%}Clear
        {% else -%}Unknown{%- endif -%}
  - switch:
    - turn_on:
      - data:
          entity_id: climate.heat_pump
          fan_mode: high
        action: climate.set_fan_mode
      turn_off:
      - data:
          entity_id: climate.heat_pump
          fan_mode: auto
        action: climate.set_fan_mode
      default_entity_id: switch.hvac_fan
      name: Fan
      state: '{{ is_state_attr(''climate.heat_pump'', ''fan_mode'', ''high'') }}'
  - switch:
      - name: "Game Time"
        unique_id: game_tie
        state: >
          {{ is_state('switch.switch_a', 'on') and is_state('switch.switch_b', 'on') }}
        turn_on:
          - service: switch.turn_on
            target:
              entity_id:
                - switch.fawkes
                - switch.usw_pro_24_poe_port_5_poe
        turn_off:
          - service: switch.turn_off
            target:
              entity_id:
                - switch.fawkes
                - switch.usw_pro_24_poe_port_5_poe

# From https://gist.github.com/AdamNaj/cbf4d792a22f443fe9d354e4dca4de00
panel_custom:
  - name: zwavegraph2
    sidebar_title: Z-Wave Graph
    sidebar_icon: mdi:access-point-network
    url_path: zwave

switch:
  - platform: wake_on_lan
    name: "Fawkes"
    mac: D8-BB-C1-93-D0-82
    host: 10.0.0.175
    turn_off:
      service: hassio.addon_stdin
      data:
        addon: core_rpc_shutdown
        input: fawkes

# Used for the automation that notifies every 30 min when the garage is open.
timer:
  garage_door:
    duration: '00:30:00'

media_player:
  - platform: universal
    name: Soundbar
    state_template: 'on'
    children:
      - media_player.living_room
      - media_player.everywhere
    commands:
      turn_on:
        service: esphome.ir_blaster_transmit_nec
        data:
          address: 0xFF00
          # The following command is the correct command for on/off, but HomeKit
          # has a quirk where it tries to make sure the soundbar is on before sending
          # volume commands. But since the on/off IR codes are the same this ends
          # up turning the sound bar off. I'm working around this by just sending the
          # volume up command since it also will turn on the sound bar.
          # command: 0x02FD
          command: 0xBE41
      turn_off:
        service: esphome.ir_blaster_transmit_nec
        data:
          address: 0xFF00
          command: 0xBF40
      volume_up:
        service: esphome.ir_blaster_transmit_nec
        data:
          address: 0xFF00
          command: 0xBE41
      volume_down:
        service: esphome.ir_blaster_transmit_nec
        data:
          address: 0xFF00
          command: 0xBA45
      volume_mute:
        service: esphome.ir_blaster_transmit_nec
        data:
          address: 0xFF00
          command: 0xB748
      select_source:
        service: esphome.ir_blaster_transmit_nec_string
        data_template:
          address: 0xFF00
          command: >-
            {%- if source == 'Optical' -%}
              0x37C8
            {%- elif source == 'Aux 1' -%}
              0x4EB1
            {%- elif source == 'USB' -%}
              0x5EA1
            {%- elif source == 'Bluetooth' -%}
              0xDD22
            {%- elif source == 'Aux 2' -%}
              0x4DB2
            {%- elif source == 'Digital' -%}
              0x36C9
            {%- endif -%}

notify:
  - name: all_devices
    platform: group
    services:
      - service: mobile_app_iphone_15_pro
